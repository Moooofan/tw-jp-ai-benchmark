<!doctype html>
<html lang="zh-Hant">
  <body style="margin:0;background:#FFD84D;font-family:'Noto Sans TC','PingFang TC','Hiragino Sans',sans-serif;color:#141210;">
    <div style="max-width:420px;margin:0 auto;padding:32px 20px;">
      <h1 style="font-size:28px;margin:0 0 4px;">推<span style="color:#E8322B;">爆</span>東京</h1>
      <p style="margin:0 0 20px;font-size:14px;color:#6B6250;">哪家台灣新創在東京最值得推？</p>
      <div style="background:#FFFFFF;border:3px solid #141210;padding:20px;text-align:center;">
        <p style="margin:0 0 10px;font-size:14px;font-weight:700;">你的驗證碼</p>
        <p style="margin:0;font-size:36px;font-weight:900;letter-spacing:.3em;">{{ .Token }}</p>
      </div>
      <p style="font-size:13px;color:#6B6250;margin:16px 0 0;">回到頁面輸入這六位數就可以推了。驗證碼一小時內有效。</p>
      <p style="font-size:12px;color:#6B6250;margin:8px 0 0;">不是你本人的話，直接忽略這封信。</p>
    </div>
  </body>
</html>
